services:
  mlflow_server:
    image: dhi.io/mlflow:3  
    container_name: mlflow_server
    ports:
      - "5000:5000"  
    networks:
      - ml_network
    volumes:
      - mlflow_sqlite_data:/BackgroundStore  
    command: >
      server 
      --backend-store-uri sqlite:///BackgroundStore/mlflow.db 
      --host 0.0.0.0 
      --port 5000
      --allowed-hosts *
    restart: unless-stopped

  knn_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knn_predict_service
    ports:
      - "8000:8000"  
    networks:
      - ml_network
    depends_on:
      - mlflow_server  
    environment:
      - S3_BUCKET=${S3_BUCKET}
      - S3_CSV_KEY=${S3_CSV_KEY}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=us-east-1
      - MODEL_NAME=${MODEL_NAME}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI}
      - GIT_PYTHON_REFRESH=quiet
    restart: unless-stopped

volumes:
  mlflow_sqlite_data: 

networks:
  ml_network:   
    driver: bridge
