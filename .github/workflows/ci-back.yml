name: ci for back

# Build + push only. Deployment into the cluster is deliberately NOT done here:
# no kubectl, no KUBE_CONFIG. A new image reaches the cluster when someone runs
# `kubectl rollout restart deployment backend -n savely` (the Deployment uses
# `imagePullPolicy: Always` with the mutable `:back` tag).

on:
  push:
    branches: [ master ]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  test-back:
    name: Run backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

  build-and-push-back:
    name: Push back Docker image to Docker Hub
    runs-on: ubuntu-latest
    needs: test-back
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: incept1on/savely

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: incept1on/savely:back
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
