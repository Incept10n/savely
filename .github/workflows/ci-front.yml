name: ci for front

# Build + push only, no cluster access. A new image reaches the cluster when
# someone runs `kubectl rollout restart deployment frontend -n savely`
# (`imagePullPolicy: Always` + the mutable `:front` tag).

on:
  push:
    branches: [ master ]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  build-and-push-front:
    name: Push front Docker image to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: incept1on/savely

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: incept1on/savely:front
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
