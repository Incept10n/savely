name: ci-cd for classifier

on:
  push:
    branches: [ master ]
    paths:
      - 'classifier/**'
  workflow_dispatch:

jobs:
  build-and-push-classifier:
    name: Push classifier image to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: incept1on/savely

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: ./classifier
          file: ./classifier/Dockerfile
          push: true
          tags: incept1on/savely:classifier
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

  deploy-classifier-prod:
    name: Update k8s classifier image
    runs-on: ubuntu-latest
    needs: build-and-push-classifier
    steps:
      - name: Get kubectl binary
        uses: tale/kubectl-action@v1
        with:
          base64-kube-config: ${{ secrets.KUBE_CONFIG }}

      - name: Restart classifier deployment
        run: |
          kubectl rollout restart deployment classifier -n savely
